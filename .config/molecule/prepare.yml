# Creates the unprivileged sudo user that converge and verify connect as, and
# installs the desktop services that a scenario requests through inventory.
---
- name: Prepare
  hosts: all
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    # A module that runs before boot completes can lose the files it stages under
    # /tmp, and raw stages no files. systemctl fails until systemd accepts
    # connections, and prints degraded with exit status 1 once a unit has failed.
    - name: Wait for systemd to finish booting
      register: _prepare_boot_state
      until: _prepare_boot_state.stdout | trim in ['running', 'degraded']
      retries: 60
      delay: 1
      changed_when: false
      failed_when: _prepare_boot_state.stdout | trim not in ['running', 'degraded']
      ansible.builtin.raw: systemctl is-system-running --wait

    # the first line maps container UID 0 to its host UID; rootful Podman maps 0 to 0
    - name: Read the UID map of the container
      register: _prepare_uid_map
      check_mode: false
      ansible.builtin.slurp:
        src: /proc/self/uid_map

    - name: Assert container root is not host root
      ansible.builtin.assert:
        that:
          - (_prepare_uid_map.content | b64decode).split()[1] != '0'
        fail_msg: container root is host root
        quiet: true

    - name: Create user molecule
      ansible.builtin.user:
        name: molecule
        uid: "{{ molecule_uid }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Grant molecule passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/molecule
        content: "molecule ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # the image policy-rc.d exits 101, which stops package scripts from starting services
    - name: Remove policy-rc.d
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent

    # the image ships with empty APT lists
    - name: Update the APT cache
      ansible.builtin.apt:
        update_cache: true

    # a user namespace cannot mount squashfs, and snapd in a container mounts
    # snaps through squashfuse when it is installed
    - name: Install squashfuse for snapd
      when: "'snapd' in molecule_prepare_packages"
      ansible.builtin.apt:
        name: [squashfuse, fuse3]
        state: present

    - name: Install scenario packages
      when: molecule_prepare_packages | length > 0
      ansible.builtin.apt:
        name: "{{ molecule_prepare_packages }}"
        state: present

    - name: Start snapd
      when: "'snapd' in molecule_prepare_packages"
      ansible.builtin.systemd:
        name: snapd.service
        state: started

    - name: Wait for snapd to seed
      when: "'snapd' in molecule_prepare_packages"
      changed_when: false
      ansible.builtin.command:
        cmd: snap wait system seed.loaded

    # a lingering user gets a systemd user manager and a D-Bus session bus,
    # which gsettings needs to persist settings through dconf
    - name: Enable lingering for molecule
      when: molecule_prepare_user_session
      ansible.builtin.command:
        cmd: loginctl enable-linger molecule
        creates: /var/lib/systemd/linger/molecule

    - name: Wait for the molecule session bus
      when: molecule_prepare_user_session
      ansible.builtin.wait_for:
        path: /run/user/{{ molecule_uid }}/bus
