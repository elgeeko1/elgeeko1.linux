---
- name: Stat the google-chrome-stable signing key
  register: _chrome_key
  ansible.builtin.stat:
    path: /usr/share/keyrings/google-chrome.gpg

# the google-chrome-stable postinst and its daily cron job rewrite this key from a copy in the
# package, so the role writes it only when it is missing
- name: Write the Google Linux signing key where google-chrome-stable keeps it
  when: not _chrome_key.stat.exists
  become: true
  block:
    - name: Download the Google Linux signing key
      register: _chrome_key_download
      check_mode: false
      ansible.builtin.uri:
        url: https://dl.google.com/linux/linux_signing_key.pub
        return_content: true

    - name: Install gpg
      ansible.builtin.apt:
        name: gpg
        state: present

    - name: Dearmor the Google Linux signing key
      ansible.builtin.command:
        cmd: gpg --dearmor --output /usr/share/keyrings/google-chrome.gpg
        stdin: "{{ _chrome_key_download.content }}"
        creates: /usr/share/keyrings/google-chrome.gpg

# the google-chrome-stable postinst and its daily cron job rewrite
# google-chrome.sources, so the role creates it once and leaves later rewrites in place
- name: Add Google Chrome APT repository
  register: _chrome_repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/google-chrome.sources
    content: |
      Types: deb
      URIs: https://dl.google.com/linux/chrome-stable/deb/
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /usr/share/keyrings/google-chrome.gpg
    force: false
    owner: root
    group: root
    mode: u=rw,g=r,o=r

- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: "{{ _chrome_repo.changed }}"

- name: Install Google Chrome
  become: true
  ansible.builtin.apt:
    name: google-chrome-stable
    state: present
