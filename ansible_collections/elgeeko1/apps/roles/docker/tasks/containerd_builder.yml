---
- name: Create .docker folder
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.docker"
    state: directory
    mode: u=rwx,g=rx,o=

- name: Docker check for running builder {{ docker_multiarch_containerd_builder_name }}
  register: _docker_r_multiarch_running
  changed_when: false
  failed_when: false
  ignore_errors: true
  ansible.builtin.shell: "docker buildx inspect {{ docker_multiarch_containerd_builder_name }} | grep running"

- name: Docker remove orphaned builder {{ docker_multiarch_containerd_builder_name }}
  when: _docker_r_multiarch_running.rc != 0
  register: _docker_r_multiarch_removed
  changed_when: _docker_r_multiarch_removed.rc == 0
  failed_when: false
  ignore_errors: true
  ansible.builtin.command: "docker buildx rm --force {{ docker_multiarch_containerd_builder_name }}"

- name: Docker create builder {{ docker_multiarch_containerd_builder_name }}
  when: _docker_r_multiarch_running.rc != 0
  changed_when: true
  ansible.builtin.command:
    cmd: >
      docker buildx create
        --name {{ docker_multiarch_containerd_builder_name }}
        --use
        --driver docker-container
        --bootstrap

# dash, the /bin/sh on Ubuntu 24.04, rejects set -o pipefail
- name: Docker inspect builder {{ docker_multiarch_containerd_builder_name }}
  when: _docker_r_multiarch_running.rc != 0
  changed_when: false
  ansible.builtin.shell:
    cmd: "set -o pipefail && docker buildx inspect {{ docker_multiarch_containerd_builder_name }} | grep running"
    executable: /bin/bash
