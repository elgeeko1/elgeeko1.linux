---
- name: Stat ~/.cache
  register: _zoom_r_cache_dir
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache"

- name: Create ~/.cache
  when: not _zoom_r_cache_dir.stat.exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache"
    state: directory
    mode: u=rwx,g=,o=

- name: Download Zoom .deb {{ zoom_version }}
  ansible.builtin.get_url:
    url: "{{ _zoom_deb_url }}"
    dest: "{{ _zoom_deb_path }}"
    mode: u=rw,g=r,o=r
    force: true

- name: Install Zoom
  become: true
  ansible.builtin.apt:
    deb: "{{ _zoom_deb_path }}"
    state: present

- name: Disable autostart
  when: zoom_disable_autostart
  ansible.builtin.import_tasks: disable_autostart.yml
