---
- name: Create the download directory
  ansible.builtin.file:
    path: "{{ zoom_download_dir }}"
    state: directory
    mode: u=rwx,g=,o=

- name: Download Zoom .deb {{ zoom_version }}
  ansible.builtin.get_url:
    url: "{{ _zoom_deb_url }}"
    dest: "{{ _zoom_deb_path }}"
    mode: u=rw,g=r,o=r
    force: "{{ zoom_version == 'latest' }}"

- name: Install Zoom
  become: true
  ansible.builtin.apt:
    deb: "{{ _zoom_deb_path }}"
    state: present

- name: Disable autostart
  when: zoom_disable_autostart
  ansible.builtin.include_tasks: disable_autostart.yml
