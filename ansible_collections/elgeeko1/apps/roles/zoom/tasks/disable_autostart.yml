---
- name: Ensure ~/.config/autostart exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
    state: directory
    mode: u=rwx,g=rx,o=rx

# Hidden=true in a user autostart entry disables the system entry of the same file name, such as
# /etc/xdg/autostart/Zoom.desktop
- name: Disable Zoom autostart in the user autostart entry
  loop:
    - option: Hidden
      value: "true"
    - option: X-GNOME-Autostart-enabled
      value: "false"
  loop_control:
    label: "{{ item.option }}"
  community.general.ini_file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/Zoom.desktop"
    section: Desktop Entry
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: u=rw,g=r,o=r
    state: present

- name: Ensure local applications dir exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
    state: directory
    mode: u=rwx,g=rx,o=rx

# force: false keeps the copy from resetting the --no-silent edit below
- name: Create Zoom desktop shortcut user override
  ansible.builtin.copy:
    src: /usr/share/applications/Zoom.desktop
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/Zoom.desktop"
    remote_src: true
    force: false
    mode: u=rw,g=r,o=r

- name: Add --no-silent to Exec in user desktop shortcut
  notify: "elgeeko1.apps.zoom : update_desktop_database"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/Zoom.desktop"
    regexp: "^Exec=(.*\\bzoom)(?!.*--no-silent)(.*)$"
    line: "Exec=\\1 --no-silent\\2"
    backrefs: true
    mode: u=rw,g=r,o=r
