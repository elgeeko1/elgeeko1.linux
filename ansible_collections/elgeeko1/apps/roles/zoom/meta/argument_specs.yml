---
argument_specs:
  main:
    short_description: Install the Zoom client from the Zoom deb package
    options:
      zoom_version:
        description: Zoom version in the download URL.
        type: str
        default: latest
      zoom_disable_autostart:
        description: Disable Zoom autostart on login.
        type: bool
        default: true
      zoom_download_dir:
        description: Directory of the connecting user that keeps the downloaded Zoom deb; defaults to `~/.cache/elgeeko1.apps/zoom`.
        type: str
