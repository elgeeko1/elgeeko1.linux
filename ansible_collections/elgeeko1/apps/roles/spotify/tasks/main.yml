---
# spotify-client copies each rotated signing key into trusted.gpg.d on upgrade,
# so a source that trusts trusted.gpg.d keeps verifying after a key rotation
- name: Download Spotify signing key
  become: true
  ansible.builtin.get_url:
    url: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc
    dest: /etc/apt/trusted.gpg.d/spotify.asc
    mode: u=rw,g=r,o=r

# spotify-client keeps an existing spotify.list and searches one-line .list
# files for an existing source, so the role writes the one-line spotify.list
- name: Configure Spotify APT repository
  register: _spotify_repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/spotify.list
    content: |
      deb https://repository.spotify.com stable non-free
    force: false
    mode: u=rw,g=r,o=r

- name: Update APT cache
  become: true
  ansible.builtin.apt:
    update_cache: "{{ _spotify_repo.changed }}"

- name: Install Spotify
  become: true
  ansible.builtin.apt:
    name: spotify-client
    state: present
