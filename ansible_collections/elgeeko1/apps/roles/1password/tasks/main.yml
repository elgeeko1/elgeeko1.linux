---
# map Ansible arch -> APT arch used by 1Password repo URL
- name: Map architecture for 1Password APT repo
  ansible.builtin.set_fact:
    _1password_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default('amd64') }}

- name: Download 1Password signing key (ASCII)
  become: true
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /usr/share/keyrings/1password.asc
    mode: u=rw,g=r,o=r
    force: true

- name: Install gpg
  become: true
  ansible.builtin.apt:
    name: gpg
    state: present

- name: Dearmor 1Password signing key for APT
  become: true
  ansible.builtin.command:
    cmd: >
      gpg --dearmor
      --yes
      --output /usr/share/keyrings/1password-archive-keyring.gpg
      /usr/share/keyrings/1password.asc
  args:
    creates: /usr/share/keyrings/1password-archive-keyring.gpg

# the 1password postinst rewrites 1password.sources, so the role creates it
# once and leaves later rewrites in place
- name: Add 1Password APT repository
  register: _1password_repo
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/1password.sources
    content: |
      Types: deb
      URIs: https://downloads.1password.com/linux/debian/{{ _1password_apt_arch }}
      Suites: stable
      Components: main
      Architectures: {{ _1password_apt_arch }}
      Signed-By: /usr/share/keyrings/1password-archive-keyring.gpg
    force: false
    mode: u=rw,g=r,o=r

- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: "{{ _1password_repo.changed }}"

- name: Install 1Password
  when: ansible_facts['architecture'] in ['x86_64', 'amd64']
  become: true
  ansible.builtin.apt:
    name:
      - 1password
    state: present

- name: Install 1Password cli
  become: true
  ansible.builtin.apt:
    name:
      - 1password-cli
    state: present
