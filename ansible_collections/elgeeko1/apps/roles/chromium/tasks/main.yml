---
# keyserver responses differ between nodes, so the key downloads only once
- name: Stat xtradeb PPA signing key
  register: _chromium_r_key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/xtradeb.asc

- name: Download xtradeb PPA signing key (ASCII-armored)
  when: not _chromium_r_key.stat.exists
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x5301FA4FD93244FBC6F6149982BB6851C64F6880"
    dest: /etc/apt/keyrings/xtradeb.asc
    mode: u=rw,go=r

- name: Install gpg
  become: true
  ansible.builtin.apt:
    name: gpg
    state: present

- name: Dearmor xtradeb signing key
  become: true
  ansible.builtin.command: >
    gpg --dearmor --yes
    --output /etc/apt/keyrings/xtradeb.gpg
    /etc/apt/keyrings/xtradeb.asc
  args:
    creates: /etc/apt/keyrings/xtradeb.gpg

- name: Add xtradeb/apps PPA deb822 repository (Chromium deb builds)
  register: _chromium_xtradeb_repo
  become: true
  ansible.builtin.deb822_repository:
    install_python_debian: true
    name: xtradeb_apps
    types: [deb]
    uris: ["https://ppa.launchpadcontent.net/xtradeb/apps/ubuntu"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: ["main"]
    signed_by: /etc/apt/keyrings/xtradeb.gpg
    state: present

- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: "{{ _chromium_xtradeb_repo.changed }}"

- name: Install Chromium
  become: true
  ansible.builtin.apt:
    name:
      - chromium
    state: present
