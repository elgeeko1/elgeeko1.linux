---
# Tailscale publishes its current signing key at a fixed URL; force downloads it
# every run and reports a change when the key changes
- name: Install Tailscale APT key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: u=rw,g=r,o=r
    force: true

- name: Configure Tailscale APT repository
  become: true
  register: tailscale_repo
  ansible.builtin.deb822_repository:
    install_python_debian: true
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: "{{ tailscale_repo.changed }}"

- name: Install Tailscale
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  become: true
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Create directory /opt/tailscale
  become: true
  ansible.builtin.file:
    path: /opt/tailscale
    state: directory
    owner: root
    group: root
    mode: u=rw,g=,o=

- name: Store Tailscale auth key securely
  become: true
  when: tailscale_auth_key | length > 0
  no_log: true
  ansible.builtin.copy:
    dest: /opt/tailscale/authkey
    content: "{{ tailscale_auth_key }}"
    owner: root
    group: root
    mode: u=rw,g=,o=

# check to avoid re-running `tailscale up` if already connected.
- name: Check whether Tailscale needs to be brought up
  ansible.builtin.command: tailscale status --json
  changed_when: false
  failed_when: false
  register:
    _tailscale_up_required: >-
      _task.result.rc != 0
      or _task.result.stdout == ''
      or (_task.result.stdout | from_json).BackendState | default('') != 'Running'

- name: Stat Tailscale auth key file
  when: _tailscale_up_required
  become: true
  register: _tailscale_r_authkey
  ansible.builtin.stat:
    path: /opt/tailscale/authkey

- name: Validate Tailscale auth key file
  when: _tailscale_up_required
  ansible.builtin.assert:
    that:
      - _tailscale_r_authkey.stat.exists
    fail_msg: tailscale_auth_key is empty and /opt/tailscale/authkey does not exist.
    quiet: true

# joining a tailnet needs a valid auth key, so tests skip this tag
- name: Bring Tailscale up and check that the backend is Running
  tags: [molecule-notest]
  ansible.builtin.import_tasks: up.yml
