---
argument_specs:
  main:
    short_description: Install Visual Studio Code from the Microsoft APT repository, with extensions
    options:
      vscode_version:
        description: "`code` package version; unset installs the candidate."
        type: str
      vscode_extensions:
        description: Extension identifiers to install.
        type: list
        elements: str
        default: []
