---
# snap info reports a Snap Store rate-limit response (HTTP 429) as "no snap found"
- name: Install alacritty (snap)
  become: true
  community.general.snap:
    name: alacritty
    channel: stable
    classic: true
    state: present
  retries: 5
  delay: 10
  until: _task.result is succeeded

- name: Create ~/.config/alacritty
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/alacritty"
    state: directory
    mode: u=rwx,g=,o=

- name: Deploy Alacritty configuration
  when: alacritty_config_template | length > 0
  ansible.builtin.template:
    src: "{{ alacritty_config_template }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/alacritty/"
    mode: u=rw,g=,o=

- name: Configure tmux
  when: alacritty_tmux_enabled
  ansible.builtin.include_tasks: tmux.yml

- name: Add "title()" shell function to ~/.bash_aliases
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
    create: true
    mode: u=rw,g=r,o=r
    marker: "# {mark} ANSIBLE MANAGED: title() function"
    block: |
      title() {
        local title_str="${*:-}"

        # strip 'sudo' prefix if present
        title_str="${title_str#sudo }"

        if [[ -n "${TMUX:-}" ]]; then
          # set tmux per-pane title (used by pane_title)
          tmux select-pane -T "$title_str"
        else
          # outside tmux: set terminal title via OSC 0
          printf '\033]0;%s\007' "$title_str"
        fi
      }

# the classic snap exports SNAP_* to its child shells, so programs started from them detect themselves as snaps
- name: Unset Alacritty snap variables in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    regexp: '^if \[ "\$\{SNAP_NAME-\}" = alacritty \]'
    line: 'if [ "${SNAP_NAME-}" = alacritty ]; then unset "${!SNAP_@}"; fi'
    create: false

- name: Reset pane title in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: "command -v title >/dev/null 2>&1 && title || true"
    create: false
