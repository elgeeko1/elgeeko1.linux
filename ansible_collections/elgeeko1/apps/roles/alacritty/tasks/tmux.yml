---
- name: Install tmux
  become: true
  ansible.builtin.package:
    name: tmux
    state: present

- name: Deploy tmux configuration
  when: alacritty_tmux_config_template | length > 0
  ansible.builtin.template:
    src: "{{ alacritty_tmux_config_template }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.tmux.conf"
    mode: u=rw,g=,o=
