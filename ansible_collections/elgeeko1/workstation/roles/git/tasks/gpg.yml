---
- name: Install GnuPG
  become: true
  ansible.builtin.package:
    name: gnupg
    state: present

- name: Create {{ _git_gpg_export_dir }}
  ansible.builtin.file:
    path: "{{ _git_gpg_export_dir }}"
    state: directory
    mode: u=rwx,g=,o=

- name: Check if a gpg secret key already exists for {{ git_github_email }}
  register:
    _git_r_gpg_key_exists: _task.result.stdout | regex_search('^sec') is not none
  changed_when: false
  check_mode: false
  failed_when: false
  ansible.builtin.command:
    cmd: "gpg --batch --with-colons --list-secret-keys {{ git_github_email }}"

- name: Build non-interactive ed25519 gpg key-parameter file
  ansible.builtin.copy:
    dest: "{{ _git_gpg_export_dir }}/{{ _git_gpg_key_name }}.keybatch"
    mode: u=rw,g=,o=
    content: |
      %no-protection
      Key-Type: eddsa
      Key-Curve: ed25519
      Subkey-Type: eddsa
      Subkey-Curve: ed25519
      Name-Real: {{ git_github_username }}
      Name-Email: {{ git_github_email }}
      Name-Comment: {{ _git_gpg_key_name }}
      Expire-Date: 0
      %commit

- name: Generate gpg key
  when: not _git_r_gpg_key_exists
  changed_when: true
  ansible.builtin.command:
    cmd: "gpg --batch --generate-key {{ _git_gpg_export_dir }}/{{ _git_gpg_key_name }}.keybatch"

- name: Set GPG_TTY in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    regexp: "^export GPG_TTY*'"
    line: "export GPG_TTY=$(tty)"
    create: false

# --check skips key generation, so a host without a key has no fingerprint to read
- name: Configure git to sign with the gpg key
  when: _git_r_gpg_key_exists or not ansible_check_mode
  ansible.builtin.include_tasks: gpg_signing.yml
