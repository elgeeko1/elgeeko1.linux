---
- name: Add 'update' alias to .bash_aliases
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
    regexp: "^alias update="
    line: "alias update='sudo apt update -q && sudo apt upgrade -y -q && sudo apt dist-upgrade -y -q && sudo apt autoremove -y -q && sudo snap refresh'"
    create: true
    mode: u=rw,g=r,o=r

- name: Append '/' to symlink directories
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    regexp: "^bind 'set mark-symlinked-directories*'"
    line: "bind 'set mark-symlinked-directories on'"
    create: false
