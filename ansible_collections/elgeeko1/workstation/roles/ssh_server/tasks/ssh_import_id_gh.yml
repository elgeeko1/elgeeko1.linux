---
- name: Fetch GitHub keys for user {{ ssh_server_github_username }}
  register:
    _ssh_server_github_keys: _task.result.content.splitlines() | reject('equalto', '') | list
  check_mode: false
  ansible.builtin.uri:
    url: https://github.com/{{ ssh_server_github_username }}.keys
    return_content: true
    status_code: 200
    validate_certs: true
    headers:
      User-Agent: ansible

- name: Authorize keys for host user {{ ssh_server_user }}
  loop: "{{ _ssh_server_github_keys }}"
  ansible.posix.authorized_key:
    user: "{{ ssh_server_user }}"
    key: "{{ item }}"
    state: present
    manage_dir: true
    exclusive: false
