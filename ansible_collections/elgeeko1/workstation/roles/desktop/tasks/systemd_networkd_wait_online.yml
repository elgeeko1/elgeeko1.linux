---
- name: Disable and mask wait-online
  register: _desktop_r_wait_online
  become: true
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online.service
    enabled: false
    masked: true
    state: stopped

- name: Systemd daemon reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: "{{ _desktop_r_wait_online.changed }}"
