---
# releases that the role supports, a subset of the base matrix
platforms:
  - &systemd
    name: ${MOLECULE_SCENARIO_NAME}-ubuntu2404
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    # --pull=always pulls the requested platform on every create, which shares its tag with
    # the other architectures; --image-volume=ignore drops the VOLUME on /sys/fs/cgroup of
    # the image, which Podman mounts over the cgroup2 mount of systemd mode
    extra_opts:
      - --platform=linux/amd64
      - --pull=always
      - --image-volume=ignore
    # capabilities apply only within the user namespace of the container
    privileged: true
    systemd: always
    # systemd-udevd fails to start in the container, which fails the Debian 12 udev postinst
    command: /usr/sbin/init systemd.mask=systemd-udevd.service
  - <<: *systemd
    name: ${MOLECULE_SCENARIO_NAME}-ubuntu2604
    image: docker.io/geerlingguy/docker-ubuntu2604-ansible:latest
  - <<: *systemd
    name: ${MOLECULE_SCENARIO_NAME}-debian12
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
  - <<: *systemd
    name: ${MOLECULE_SCENARIO_NAME}-debian13
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
provisioner:
  inventory:
    group_vars:
      all:
        molecule_prepare_packages:
          - gsettings-desktop-schemas
          - libglib2.0-bin
          - dbus-user-session
          - dconf-gsettings-backend
        molecule_prepare_user_session: true
