---
argument_specs:
  main:
    short_description: Baseline configuration for Debian and Ubuntu hosts
    options:
      core_target_user:
        description: User that owns user-scoped files; defaults to `ansible_user`, then `ansible_ssh_user`, then `$USER` on the controller.
        type: str
      core_timezone:
        description: IANA timezone name, such as `America/Los_Angeles`; unset leaves the timezone unchanged.
        type: str
      core_ntp_enabled:
        description: Install ntpsec and keep its service running.
        type: bool
        default: true
      core_apt_upgrade_state:
        description: When to upgrade APT packages; `once` upgrades on the first run on each host.
        type: str
        choices: ["no", always, once]
        default: once
      core_python_version:
        description: "`python3-dev` version, such as `3.12`; unset installs the candidate."
        type: str
      core_apt_snapshot:
        description: Ubuntu archive snapshot in `YYYYMMDDTHHMMSSZ` form, such as `20230302T030400Z`; unset leaves snapshots unconfigured.
        type: str
