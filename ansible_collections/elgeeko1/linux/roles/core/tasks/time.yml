---
- name: Package install tzdata
  become: true
  ansible.builtin.package:
    name:
      - tzdata
    state: present

- name: Set timezone
  when: core_timezone | default('', true) | length > 0
  become: true
  community.general.timezone:
    name: "{{ core_timezone }}"

- name: Package install ntpsec
  when: core_ntp_enabled
  become: true
  ansible.builtin.package:
    name:
      - ntpsec
    state: present

- name: Enable ntpsec
  when: core_ntp_enabled
  become: true
  ansible.builtin.service:
    name: ntpsec
    state: started
    enabled: true
