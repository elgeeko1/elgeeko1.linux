---
- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # 1 hr

- name: Install Python
  ansible.builtin.import_tasks: python.yml

- name: Install Ansible dependencies
  ansible.builtin.import_tasks: ansible_deps.yml
