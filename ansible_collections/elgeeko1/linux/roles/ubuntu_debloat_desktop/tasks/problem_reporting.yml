---
- name: Query gnome technical problems setting
  register: _ubuntu_debloat_desktop_r_technical_problems
  changed_when: false
  ansible.builtin.command: |
    gsettings get org.gnome.desktop.privacy report-technical-problems

- name: Gnome disable technical reports
  when: _ubuntu_debloat_desktop_r_technical_problems.stdout != "false"
  changed_when: true
  notify: "elgeeko1.linux.ubuntu_debloat_desktop : schedule_reboot"
  ansible.builtin.command: |
    gsettings set org.gnome.desktop.privacy report-technical-problems false

# crash reports may occur during first bringup of a virtual desktop
# or during reconfiguration of services. as these are one-time and
# related to configuring, they may be removed to prevent a crash
# report from being the first window that appears on initial startup.
- name: Find crash reports in /var/crash
  become: true
  register: _ubuntu_debloat_desktop_r_crash_reports
  ansible.builtin.find:
    paths: /var/crash
    file_type: any

- name: Remove crash reports from /var/crash
  loop: "{{ _ubuntu_debloat_desktop_r_crash_reports.files | map(attribute='path') }}"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
