---
- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # 1 hr

- name: Package install tzdata
  become: true
  ansible.builtin.package:
    name:
      - tzdata
    state: present

- name: Set timezone
  when: time_timezone | default('', true) | length > 0
  become: true
  community.general.timezone:
    name: "{{ time_timezone }}"

- name: Set the hardware clock to local time
  when: time_local_rtc
  become: true
  community.general.timezone:
    hwclock: local

- name: Package install ntpsec
  when: time_ntp_enabled
  register: _time_r_ntpsec
  become: true
  ansible.builtin.package:
    name:
      - ntpsec
    state: present

# --check does not install ntpsec, so a host without the package has no ntpsec service to start
- name: Enable ntpsec
  when:
    - time_ntp_enabled
    - not (ansible_check_mode and _time_r_ntpsec is changed)
  become: true
  ansible.builtin.service:
    name: ntpsec
    state: started
    enabled: true
