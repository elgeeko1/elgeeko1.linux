---
- name: Apt update cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600 # 1 hr

- name: Package install tzdata
  become: true
  ansible.builtin.package:
    name:
      - tzdata
    state: present

- name: Set timezone
  when: time_timezone | default('', true) | length > 0
  become: true
  community.general.timezone:
    name: "{{ time_timezone }}"

- name: Package install ntpsec
  when: time_ntp_enabled
  become: true
  ansible.builtin.package:
    name:
      - ntpsec
    state: present

- name: Enable ntpsec
  when: time_ntp_enabled
  become: true
  ansible.builtin.service:
    name: ntpsec
    state: started
    enabled: true
