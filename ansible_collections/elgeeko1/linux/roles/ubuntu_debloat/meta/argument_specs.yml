---
argument_specs:
  main:
    short_description: Debloat Ubuntu by disabling automatic updates and removing error reporting and the Ubuntu Pro client
    options:
      ubuntu_debloat_trim_motd:
        description: Remove the dynamic message of the day entries.
        type: bool
        default: false
      ubuntu_debloat_disable_unattended_upgrades:
        description: Disable unattended upgrades.
        type: bool
        default: true
      ubuntu_debloat_disable_error_reporting:
        description: Remove error reporting.
        type: bool
        default: true
      ubuntu_debloat_disable_pro:
        description: Remove the Ubuntu Pro client.
        type: bool
        default: true
