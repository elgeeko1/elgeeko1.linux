---
argument_specs:
  main:
    short_description: Upgrade APT packages on Debian and Ubuntu hosts
    options:
      apt_upgrade_state:
        description: When to upgrade APT packages; `once` upgrades on the first run on each host.
        type: str
        choices: ["no", always, once]
        default: once
      apt_upgrade_snapshot:
        description: Ubuntu archive snapshot in `YYYYMMDDTHHMMSSZ` form, such as `20230302T030400Z`; unset leaves snapshots unconfigured.
        type: str
