# reusable workflow: Molecule scenarios, one job per scenario
name: Molecule

on:
  workflow_call:
    inputs:
      platform:
        description: Platform to test in each scenario, such as ubuntu2604; empty tests every platform
        type: string
        required: false
        default: ""

defaults:
  run:
    shell: bash

jobs:
  scenarios:
    name: scenarios
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List Molecule scenarios
        id: list
        run: |
          matrix=$(
            find ansible_collections/elgeeko1/*/extensions/molecule -mindepth 2 -maxdepth 2 -name molecule.yml \
              | sort \
              | jq -R -s -c '[splits("\n") | select(length > 0) | split("/")
                  | {collection: .[2], scenario: .[5]}]'
          )
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  molecule:
    name: ${{ matrix.collection }}.${{ matrix.scenario }}
    needs: scenarios
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scenarios.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python

      # each platform in .config/molecule/config.yml is named <scenario>-<platform>
      - name: Run molecule
        working-directory: ansible_collections/elgeeko1/${{ matrix.collection }}
        env:
          SCENARIO: ${{ matrix.scenario }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ -n "${PLATFORM}" ]]; then
            molecule test -s "${SCENARIO}" -p "${SCENARIO}-${PLATFORM}"
          else
            molecule test -s "${SCENARIO}"
          fi
